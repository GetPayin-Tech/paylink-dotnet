name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build and publish to NuGet
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify the tag matches the project version (release runs only)
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Paylink/Paylink.csproj)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Paylink.csproj version $VERSION"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test (Release)
        run: dotnet test -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Paylink/Paylink.csproj -c Release --no-build -o artifacts
          dotnet pack src/Paylink.DependencyInjection/Paylink.DependencyInjection.csproj -c Release --no-build -o artifacts

      - name: Publish to NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
